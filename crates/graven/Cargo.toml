[package]
name = "graven"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WIST consumer CLI: verified cold-start sync against an aggregator log"

[dependencies]
wist-core = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = "2"
rmcp = { version = "3", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
